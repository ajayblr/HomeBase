org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=false
kotlin.code.style=official

# Where the TV checks for new versions of HomeBase (version.json).
# The GitHub workflow sets this automatically; for local builds put your own, e.g.
# updateUrl=https://github.com/YOUR-NAME/HomeBase/releases/latest/download/version.json
updateUrl=

# Bump this for every build you install by hand (CI uses the run number instead)
versionCode=1
