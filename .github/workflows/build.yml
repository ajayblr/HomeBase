# Builds HomeBase on every push to main and publishes a GitHub Release with:
#   HomeBase.apk  - the signed app
#   version.json  - what the TV checks to see if there's a newer build
# The TV's built-in updater reads .../releases/latest/download/version.json
name: Build HomeBase

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Pinned: this image ships with the Android SDK already installed
    runs-on: ubuntu-24.04
    env:
      VERSION_CODE: ${{ github.run_number }}
      UPDATE_URL: https://github.com/${{ github.repository }}/releases/latest/download/version.json
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then echo "::error::Android SDK not found on runner at $SDK"; exit 1; fi
          echo "sdk.dir=$SDK" > local.properties
          echo "Using Android SDK at $SDK"

      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          missing=""
          [ -n "$KS_B64" ] || missing="$missing KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::These repository secrets are missing or empty:$missing"
            exit 1
          fi
          mkdir -p keystore
          # Strip spaces/line breaks that sneak in when pasting the long value
          printf '%s' "$KS_B64" | tr -d ' \r\n\t' | base64 -d > keystore/release.jks || {
            echo "::error::KEYSTORE_BASE64 isn't valid - paste the full line from github-secrets.txt again"; exit 1; }
          keytool -list -keystore keystore/release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null || {
            echo "::error::Keystore opened but the password or alias doesn't match - re-paste KEYSTORE_PASSWORD / KEY_ALIAS"; exit 1; }
          echo "Signing key OK"

      - name: Build signed APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log; rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            echo "::error::Gradle build failed: $(grep -E '^e: |error:|What went wrong' -A2 build.log | head -c 1500 | tr '\n' ' ')"
            exit $rc
          fi

      - name: Prepare release files
        run: |
          cp app/build/outputs/apk/release/app-release.apk HomeBase.apk
          cat > version.json <<JSON
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "1.0.${{ github.run_number }}",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/latest/download/HomeBase.apk"
          }
          JSON
          cat version.json
          # List the photos in wallpapers/ for the TV's "Your photos" background
          python3 - <<'LIST'
          import json, os, urllib.parse
          repo = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ.get("GITHUB_REF_NAME", "main")
          exts = (".jpg", ".jpeg", ".png", ".webp")
          files = sorted(f for f in os.listdir("wallpapers") if f.lower().endswith(exts)) if os.path.isdir("wallpapers") else []
          urls = [f"https://raw.githubusercontent.com/{repo}/{branch}/wallpapers/{urllib.parse.quote(f)}" for f in files]
          json.dump(urls, open("wallpapers.json", "w"), indent=2)
          print(f"{len(urls)} wallpaper(s)")
          LIST

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: HomeBase 1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: |
            HomeBase.apk
            version.json
            wallpapers.json
          make_latest: true
