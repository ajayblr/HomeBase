# Builds HomeBase on every push to main and publishes a GitHub Release with:
#   HomeBase.apk  - the signed app
#   version.json  - what the TV checks to see if there's a newer build
# The TV's built-in updater reads .../releases/latest/download/version.json
name: Build HomeBase

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      UPDATE_URL: https://github.com/${{ github.repository }}/releases/latest/download/version.json
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Restore signing key
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/release.jks
          test -s keystore/release.jks || { echo "KEYSTORE_BASE64 secret is missing - see README"; exit 1; }

      - name: Build signed APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Prepare release files
        run: |
          cp app/build/outputs/apk/release/app-release.apk HomeBase.apk
          cat > version.json <<JSON
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "1.0.${{ github.run_number }}",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/latest/download/HomeBase.apk"
          }
          JSON
          cat version.json

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: HomeBase 1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: |
            HomeBase.apk
            version.json
          make_latest: true
